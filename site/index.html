<title>Mohit Does Something</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one full-screen stage. Pastel sky, a floral-bedsheet floor, sticker UI floating on top, and the party roaming over everything. */
:root{
  --sky-1:#ffd3e4; --sky-2:#ffe8d6; --floor:#fff3ea; --floor-dot:#ffb3c6; --floor-dot-2:#c9b5ff;
  --ink:#4b3452; --ink-soft:#866f8c; --paper:#fffaf7; --accent:#ff6f9c; --on-accent:#ffffff;
  --lav:#b49bff; --mint:#6fd3bf; --butter:#ffd166; --peach:#ffa978;
  --btn-depth:#e7a9bf; --shadow:rgba(75,52,82,.2); --cloud:#ffffff; --stars:0;
  --laser:#ff2d55; --laser-glow:rgba(255,45,85,.45);
  --line:#4b3452; --sticker:#ffffff; --blush:#ff9fb8; --badge-ink:#4b3452;
  --poi-bg:#e3f1ff; --mao-bg:#eee8ff; --mohit-bg:#ffefe0;
  --f-display:"Fredoka","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-1:#241e48; --sky-2:#4b376e; --floor:#33295a; --floor-dot:#5d4a95; --floor-dot-2:#7b5e8e;
    --ink:#fff0f6; --ink-soft:#cbbde3; --paper:#2e2550; --accent:#ff7fa8;
    --lav:#a68cff; --mint:#5cc7b2; --butter:#ffcb57; --peach:#ff9f6b;
    --btn-depth:#171230; --shadow:rgba(0,0,0,.4); --cloud:#efe8ff; --stars:1;
    --poi-bg:#2b3960; --mao-bg:#3a2f60; --mohit-bg:#453057; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky-1:#241e48; --sky-2:#4b376e; --floor:#33295a; --floor-dot:#5d4a95; --floor-dot-2:#7b5e8e;
  --ink:#fff0f6; --ink-soft:#cbbde3; --paper:#2e2550; --accent:#ff7fa8;
  --lav:#a68cff; --mint:#5cc7b2; --butter:#ffcb57; --peach:#ff9f6b;
  --btn-depth:#171230; --shadow:rgba(0,0,0,.4); --cloud:#efe8ff; --stars:1;
  --poi-bg:#2b3960; --mao-bg:#3a2f60; --mohit-bg:#453057; color-scheme:dark;
}

html,body{height:100%}
body{background:var(--sky-1);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#stage{position:relative;height:100%;overflow:hidden;touch-action:manipulation;
  background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 70%)}

/* sky dressing */
.stars{position:absolute;inset:0 0 30% 0;opacity:var(--stars);pointer-events:none;transition:opacity .6s;
  background-image:
   radial-gradient(2px 2px at 12% 18%,#fff 60%,transparent 70%),
   radial-gradient(1.5px 1.5px at 28% 42%,#fff 60%,transparent 70%),
   radial-gradient(2.5px 2.5px at 46% 12%,#fff 60%,transparent 70%),
   radial-gradient(1.5px 1.5px at 63% 35%,#fff 60%,transparent 70%),
   radial-gradient(2px 2px at 81% 20%,#fff 60%,transparent 70%),
   radial-gradient(1.5px 1.5px at 92% 48%,#fff 60%,transparent 70%),
   radial-gradient(2px 2px at 7% 58%,#fff 60%,transparent 70%),
   radial-gradient(1.5px 1.5px at 37% 64%,#fff 60%,transparent 70%),
   radial-gradient(2px 2px at 72% 60%,#fff 60%,transparent 70%)}
.puffcloud{position:absolute;width:120px;height:40px;border-radius:40px;background:var(--cloud);
  opacity:calc(.85 - var(--stars)*.75);pointer-events:none;animation:drift 38s linear infinite}
.puffcloud::before,.puffcloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.puffcloud::before{width:56px;height:56px;left:18px;top:-26px}
.puffcloud::after{width:44px;height:44px;left:58px;top:-18px}
.puffcloud.c2{top:30%;transform:scale(.7);animation-duration:52s;animation-delay:-20s}
.puffcloud.c1{top:9%}
@keyframes drift{from{left:-160px}to{left:110%}}

/* floral bedsheet floor */
.floor{position:absolute;left:-15%;right:-15%;bottom:0;height:31%;
  border-radius:50% 50% 0 0/46px 46px 0 0;background-color:var(--floor);
  background-image:radial-gradient(circle,var(--floor-dot) 3px,transparent 4px),
                   radial-gradient(circle,var(--floor-dot-2) 2.5px,transparent 3.5px);
  background-size:52px 40px,52px 40px;background-position:0 0,26px 20px;
  box-shadow:0 -6px 0 var(--sticker) inset, 0 -2px 18px var(--shadow)}

/* UI layer */
.ui{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:clamp(18px,5vh,56px) 0;pointer-events:none}
.ui > *{pointer-events:auto}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.9;font-family:var(--f-display);
  font-weight:700;text-align:center;position:relative}
.logo .w1{font-size:clamp(58px,18vw,112px);letter-spacing:.01em}
.logo .w2{font-size:clamp(28px,8.6vw,54px);margin-top:4px}
.logo span.l{display:inline-block;color:var(--c);-webkit-text-stroke:2px var(--line);
  text-shadow:0 4px 0 var(--sticker),0 -4px 0 var(--sticker),4px 0 0 var(--sticker),-4px 0 0 var(--sticker),
   3px 3px 0 var(--sticker),-3px 3px 0 var(--sticker),3px -3px 0 var(--sticker),-3px -3px 0 var(--sticker),
   0 9px 10px var(--shadow);
  animation:wave 2.8s ease-in-out infinite;animation-delay:calc(var(--i)*-.12s);transform-origin:50% 90%;cursor:pointer}
.logo span.l.boing{animation:boing .5s cubic-bezier(.3,1.6,.5,1)}
.logo .sp{display:inline-block;width:.28em}
@keyframes wave{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-2deg)}}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.35,.7)}60%{transform:scale(.85,1.25) translateY(-10px)}100%{transform:scale(1)}}
.badge{position:absolute;right:-6px;top:-4px;transform:rotate(9deg);font:700 15px/1 var(--f-display);
  background:var(--butter);color:var(--badge-ink);padding:7px 12px 6px;border-radius:999px;
  box-shadow:0 0 0 3px var(--sticker),0 5px 10px var(--shadow);animation:badge 3s ease-in-out infinite}
@keyframes badge{50%{transform:rotate(3deg) scale(1.06)}}

.tagline{margin:14px 0 0;max-width:30ch;text-align:center;font-weight:700;font-size:15px;line-height:1.45;
  color:var(--ink-soft);text-wrap:balance}
.tagline a{color:var(--accent);font-weight:800;text-decoration:none}

.menu{margin-top:clamp(14px,3.2vh,28px);width:min(100%,340px);display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px}
.btn{font:600 16px/1 var(--f-display);color:var(--ink);background:var(--paper);border:0;border-radius:999px;
  padding:13px 8px 12px;cursor:pointer;box-shadow:0 0 0 3px var(--sticker),0 6px 0 3px var(--btn-depth),0 10px 18px var(--shadow);
  transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.btn:active,.btn.pressed{transform:translateY(5px);box-shadow:0 0 0 3px var(--sticker),0 1px 0 3px var(--btn-depth)}
.btn:focus-visible{outline:3px dashed var(--accent);outline-offset:6px}
.btn.primary{grid-column:1/-1;background:var(--accent);color:var(--on-accent);font-size:22px;padding:16px 10px 15px;
  display:flex;align-items:center;justify-content:center;gap:10px}
.btn.primary svg{width:22px;height:22px}
.hint{margin:16px 0 0;font:600 13px/1.3 var(--f-display);color:var(--ink-soft);background:var(--paper);
  padding:6px 12px;border-radius:999px;box-shadow:0 0 0 2px var(--sticker);transition:opacity .6s}
.hint .touch{display:none}
@media (hover:none){.hint .mouse{display:none}.hint .touch{display:inline}}
.hint.gone{opacity:0}

/* Hinglish: dotted underline, tap/hover for English */
.hi{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;position:relative;
  text-decoration:underline dotted 2px;text-underline-offset:3px;text-decoration-color:var(--accent)}
.hi::after{content:attr(data-en);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) scale(.8);
  opacity:0;pointer-events:none;white-space:nowrap;font:700 13px/1 var(--f-body);color:var(--on-accent);
  background:var(--accent);padding:7px 10px;border-radius:10px;box-shadow:0 0 0 2px var(--sticker);
  transition:opacity .15s,transform .15s;z-index:5}
.hi.open::after{opacity:1;transform:translateX(-50%) scale(1)}
@media (hover:hover){.hi:hover::after{opacity:1;transform:translateX(-50%) scale(1)}}

/* World + sprites */
#world{position:absolute;inset:0;z-index:3;pointer-events:none}
.sprite{position:absolute;left:0;top:0;pointer-events:auto;will-change:transform;touch-action:manipulation;cursor:pointer}
.sprite .flip{position:absolute;inset:0;transform-origin:50% 100%}
.sprite .squash{position:absolute;inset:0;transform-origin:50% 100%}
.sprite svg{width:100%;height:100%;display:block;overflow:visible;
  filter:drop-shadow(2.5px 0 0 var(--sticker)) drop-shadow(-2.5px 0 0 var(--sticker)) drop-shadow(0 2.5px 0 var(--sticker)) drop-shadow(0 -2.5px 0 var(--sticker)) drop-shadow(0 6px 5px var(--shadow))}
.sprite .shadow{position:absolute;left:18%;right:18%;bottom:4%;height:10%;border-radius:50%;background:var(--shadow);filter:blur(2px)}
.sprite.mohit .shadow{bottom:-1%;height:6%;left:22%;right:22%}
.sprite.land .squash{animation:squash .28s ease-out}
@keyframes squash{0%{transform:scale(1.18,.8)}55%{transform:scale(.94,1.08)}100%{transform:scale(1)}}

.bubble{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:6px;width:max-content;max-width:210px;
  font:600 13px/1.3 var(--f-display);color:var(--ink);background:var(--paper);padding:8px 11px;border-radius:16px;text-align:center;
  box-shadow:0 0 0 2.5px var(--sticker),0 6px 14px var(--shadow);pointer-events:none;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.bubble small{display:block;font:600 11px/1.3 var(--f-body);color:var(--ink-soft);margin-top:2px}
.bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--paper)}
@keyframes pop{from{transform:translateX(-50%) scale(.4);opacity:0}}

/* ---- cat parts ---- */
.cat .tail-g{transform-origin:42px 80px;animation:swish 1.9s ease-in-out infinite alternate}
@keyframes swish{from{transform:rotate(-9deg)}to{transform:rotate(11deg)}}
.cat .breath{transform-origin:70px 109px;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025,1.045)}}
.cat .leg{transform-box:fill-box;transform-origin:50% 10%;transition:transform .2s}
.cat .up{transition:transform .22s}
.cat .head{transform-origin:96px 88px;transition:transform .2s}
.cat .ear{transform-box:fill-box;transition:transform .2s}
.cat .ear-far{transform-origin:80% 100%}.cat .ear-near{transform-origin:20% 100%}
.cat .eyes-open{transform-box:fill-box;transform-origin:center;animation:blink 4.3s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.cat .eyes-closed,.cat .tongue,.cat .claws{display:none}
.sprite.mao .eyes-open{animation-delay:-1.7s}

.st-run .leg-fb,.st-run .leg-nf,.st-walk .leg-fb,.st-walk .leg-nf{animation:legA .26s ease-in-out infinite alternate}
.st-run .leg-nb,.st-run .leg-ff,.st-walk .leg-nb,.st-walk .leg-ff{animation:legA .26s ease-in-out infinite alternate-reverse}
.st-walk .leg{animation-duration:.42s !important}
@keyframes legA{from{transform:rotate(32deg)}to{transform:rotate(-32deg)}}
.st-run .squash{animation:hop .26s ease-in-out infinite alternate}
.st-walk .squash{animation:hop .42s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-5%)}}
.st-run .tail-g,.st-walk .tail-g{animation:none;transform:rotate(24deg)}

.st-crouch .up{transform:translateY(6px)}
.st-crouch .leg{transform:scaleY(.68)}
.st-crouch .squash{transform-origin:78% 100%;animation:wiggle .18s ease-in-out infinite alternate}
.st-crouch .tail-g{animation:swish .2s infinite alternate}
.st-crouch .eyes-open{animation:none;transform:scale(1.12)}
@keyframes wiggle{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}

.st-air .leg-ff,.st-air .leg-nf{transform:rotate(-58deg)}
.st-air .leg-fb,.st-air .leg-nb{transform:rotate(48deg)}
.st-air .squash{transform:scale(.92,1.1)}

.st-slap .leg-nf{animation:slapK .16s ease-in-out 4 alternate}
.st-slap .claws{display:block}
.st-slap .head{transform:rotate(-7deg)}
.st-slap .eyes-open{animation:none;transform:scaleY(.62)}
@keyframes slapK{from{transform:rotate(0)}to{transform:rotate(-105deg)}}

.st-boop .head{animation:boopK .9s ease-in-out}
.st-boop .eyes-open,.st-groom .eyes-open,.st-happy .eyes-open{display:none}
.st-boop .eyes-closed,.st-groom .eyes-closed,.st-happy .eyes-closed{display:block}
@keyframes boopK{30%{transform:translateX(8px) rotate(-9deg)}55%{transform:translateX(2px) rotate(5deg)}}

.st-groom .up,.st-loaf .up,.st-distracted .up,.st-hide .up,.st-happy .up,.st-annoyed .up{transform:translateY(9px)}
.st-groom .leg,.st-loaf .leg,.st-distracted .leg,.st-hide .leg,.st-happy .leg,.st-annoyed .leg{transform:scaleY(.28)}
.st-groom .head{animation:groomK .45s ease-in-out infinite alternate}
.st-groom .tongue{display:block}
@keyframes groomK{from{transform:rotate(12deg)}to{transform:rotate(24deg)}}

.st-distracted .head{transform:rotate(-16deg)}
.st-distracted .eyes-open{animation:none;transform:scale(1.14)}
.st-distracted .tail-g{animation-duration:3.5s}

.st-annoyed .eyes-open{animation:none;transform:scaleY(.42)}
.st-annoyed .tail-g{animation:flick .14s infinite alternate}
.st-annoyed .head{transform:rotate(-8deg)}
@keyframes flick{from{transform:rotate(-16deg)}to{transform:rotate(26deg)}}

.st-hide .ear-far{transform:rotate(-40deg)}
.st-hide .ear-near{transform:rotate(40deg)}
.st-hide .eyes-open{animation:none;transform:scaleY(.55)}
.st-hide .squash{animation:shy 1.3s infinite}
@keyframes shy{0%,40%,100%{transform:translateX(0)}10%{transform:translateX(-2px)}20%{transform:translateX(2px)}30%{transform:translateX(-1px)}}

.st-happy .squash{animation:purr .08s linear infinite alternate}
@keyframes purr{to{transform:translate(.7px,-.6px)}}

.st-fight .squash{animation:fightK .11s linear infinite alternate}
.st-fight .leg{animation:legA .11s infinite alternate}
@keyframes fightK{from{transform:rotate(-13deg) translateX(-4px)}to{transform:rotate(13deg) translateX(4px)}}

/* ---- mohit parts ---- */
.mohit .m-body{transform-origin:60px 160px;animation:breathe 2.8s ease-in-out infinite}
.mohit .m-head{transform-origin:60px 96px;animation:headbob 2.8s ease-in-out infinite}
@keyframes headbob{50%{transform:translateY(1.5px) rotate(-1.6deg)}}
.mohit .m-lids{animation:mblink 4.8s infinite}
@keyframes mblink{0%,91%,100%{transform:translateY(0)}94%{transform:translateY(5px)}}
.mohit .m-ahoge{transform-origin:64px 17px;animation:ahoge 1.5s ease-in-out infinite alternate}
@keyframes ahoge{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.mohit .sweat,.mohit .glint{opacity:0}
.st-glasses .m-glasses{animation:glassesK .8s ease-in-out}
.st-glasses .glint{animation:glint .8s ease-in-out}
@keyframes glassesK{35%,65%{transform:translateY(-4px)}}
@keyframes glint{40%,60%{opacity:1}}
.st-flustered .sweat{opacity:1}
.st-flustered .m-head{animation:shy .7s infinite}
.st-flustered .m-lids{animation:none;transform:translateY(-3px)}

/* effects */
.fx{position:absolute;left:0;top:0;pointer-events:none;z-index:2000;font:700 16px/1 var(--f-display);color:var(--accent);
  text-shadow:0 2px 0 var(--sticker),0 -2px 0 var(--sticker),2px 0 0 var(--sticker),-2px 0 0 var(--sticker);
  animation:floatUp 1s ease-out forwards;white-space:nowrap}
.fx svg{display:block;filter:drop-shadow(0 0 2px var(--sticker))}
.fx.stay{animation:fadeOut 1.4s ease-in forwards}
@keyframes floatUp{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}20%{transform:translate(-50%,-90%) scale(1.15);opacity:1}100%{transform:translate(-50%,-220%) scale(1);opacity:0}}
@keyframes fadeOut{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}15%{transform:translate(-50%,-50%) scale(1.1);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.laser{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--laser);
  box-shadow:0 0 0 3px var(--laser-glow),0 0 16px 5px var(--laser-glow);pointer-events:none;opacity:0;transition:opacity .2s}
.laser.on{opacity:1}
.ripple{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid var(--laser);
  pointer-events:none;animation:ripple .5s ease-out forwards}
@keyframes ripple{from{transform:scale(.2);opacity:1}to{transform:scale(1.4);opacity:0}}
.fight{position:absolute;pointer-events:none;transform:translate(-50%,-80%)}
.fight i{position:absolute;border-radius:50%;background:var(--cloud);box-shadow:0 0 0 3px var(--sticker),0 6px 12px var(--shadow);animation:puff .3s ease-in-out infinite alternate}
.fight b{position:absolute;font:700 18px/1 var(--f-display);color:var(--butter);text-shadow:0 0 3px var(--line);animation:spin .6s linear infinite}
.fight em{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);font:700 12px/1 var(--f-display);font-style:normal;color:var(--ink-soft);white-space:nowrap}
@keyframes puff{to{transform:scale(1.12)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* RPG dialog box */
#dialog{position:absolute;z-index:40;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:520px;background:var(--paper);color:var(--ink);
  border-radius:22px;padding:18px 20px 14px;font:600 17px/1.45 var(--f-display);
  box-shadow:0 0 0 4px var(--sticker),0 0 0 7px var(--accent),0 16px 30px var(--shadow);animation:dlg .35s cubic-bezier(.3,1.5,.5,1)}
#dialog .tag{position:absolute;top:-14px;left:18px;background:var(--accent);color:var(--on-accent);font:700 12px/1 var(--f-display);
  letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;box-shadow:0 0 0 3px var(--sticker)}
#dialog .next{display:block;text-align:right;font-size:12px;color:var(--ink-soft);margin-top:6px;animation:nudge .8s ease-in-out infinite alternate}
@keyframes dlg{from{transform:translateY(30px) scale(.9);opacity:0}}
@keyframes nudge{to{transform:translateY(3px)}}

/* Party sheet (art test) */
#sheet{position:absolute;inset:0;z-index:50;background:color-mix(in srgb,var(--sky-1) 70%,transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow-y:auto;overscroll-behavior:contain}
.sheet-inner{max-width:1040px;margin:0 auto;padding-block:22px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.sheet-head h2{margin:0;font:700 clamp(26px,7vw,40px)/1 var(--f-display);color:var(--ink);text-wrap:balance}
.sheet-head p{margin:6px 0 0;font-weight:700;font-size:14px;color:var(--ink-soft)}
.close{flex:none;width:48px;height:48px;padding:0;font-size:22px;display:grid;place-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:26px}
.card{background:var(--paper);border-radius:28px;padding:14px 16px 18px;box-shadow:0 0 0 4px var(--sticker),0 14px 28px var(--shadow);
  display:flex;flex-direction:column;gap:10px;min-width:0}
.stagebox{border-radius:20px;height:210px;display:grid;place-items:end center;padding-bottom:16px;position:relative;overflow:hidden}
.stagebox::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:color-mix(in srgb,var(--sticker) 40%,transparent)}
.stagebox .sprite{position:relative;z-index:1;cursor:default}
.card h3{margin:2px 0 0;font:700 28px/1 var(--f-display);color:var(--ink);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card h3 small{font:700 12px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--on-accent);background:var(--role);padding:5px 9px;border-radius:999px}
.card .facts{margin:0;font-weight:700;font-size:13px;color:var(--ink-soft)}
.card .about{margin:0;font-size:15px;line-height:1.45;font-weight:600}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font:700 12px/1 var(--f-display);letter-spacing:.06em}
.stats .bar{height:10px;border-radius:999px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden}
.stats .bar i{display:block;height:100%;border-radius:inherit;background:var(--role)}

<script>
(() => {

// Ages are worked out from each cat's birthday, so they stay right for as long as the site is up.
const DOB = { poi: new Date(2026, 5, 7), mao: new Date(2026, 6, 23) };
function age(dob, now = new Date()) {
  let months = (now.getFullYear() - dob.getFullYear()) * 12 + now.getMonth() - dob.getMonth();
  if (now.getDate() < dob.getDate()) months--;
  const mark = new Date(dob.getFullYear(), dob.getMonth() + months, dob.getDate());
  const days = Math.floor((now - mark) / 864e5);
  if (months < 1) { const w = Math.max(1, Math.floor((now - dob) / 6048e5)); return `${w} week${w > 1 ? 's' : ''}`; }
  if (months < 12) return `${months}${days >= 15 ? '½' : ''} month${months > 1 || days >= 15 ? 's' : ''}`;
  const y = Math.floor(months / 12), m = months % 12;
  return `${y} year${y > 1 ? 's' : ''}${m ? ` ${m} month${m > 1 ? 's' : ''}` : ''}`;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },

}
function makeSprite(kind) {
  const el = document.createElement('div');
  el.className = `sprite ${kind === 'mohit' ? 'mohit' : 'cat ' + kind} st-idle`;
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', { mohit: 'Mohit', poi: 'PoiPoi', mao: 'MaoMao' }[kind]);
  el.innerHTML = `<div class="shadow"></div><div class="flip"><div class="squash">${kind === 'mohit' ? mohitSVG() : catSVG(CATS[kind])}</div></div><div class="bubble" hidden></div>`;
  return el;
}

/* ---------- entities ---------- */
let W = 0, H = 0, u = 1;
function ent(kind, base) {
  const el = makeSprite(kind);
  world.appendChild(el);
  return { kind, el, flip: el.querySelector('.flip'), bub: el.querySelector('.bubble'), base,
    x: 0, y: 0, w: 0, h: 0, dir: 1, hopY: 0, z: 0, state: 'idle', tasks: [], bw: 0 };
}
const mohit = ent('mohit', 112), poi = ent('poi', 104), mao = ent('mao', 74);
poi.speed = 250; mao.speed = 330; poi.nextDistract = 0; mao.trust = store.get('maoTrust', 0);
poi.off = 7; mao.off = -3;
const cats = [poi, mao];

function size() {
  W = stage.clientWidth; H = stage.clientHeight;
  u = clamp(Math.min(W, H * 0.62) / 420, 0.8, 1.35);
  for (const e of [mohit, poi, mao]) {
    e.w = e.base * u; e.h = e.kind === 'mohit' ? e.w * 170 / 120 : e.w * 120 / 140;
    e.el.style.width = e.w + 'px'; e.el.style.height = e.h + 'px';
    e.foot = e.kind === 'mohit' ? 0.985 : 0.92;
    e.nose = e.kind === 'mohit' ? 0 : e.w * 0.25;
  }
  mohit.x = clamp(W * 0.74, mohit.w * 0.6, W - mohit.w * 0.6); mohit.y = H - 16 * u;
}
function setState(e, s) {
  if (e.state === s) return;
  e.el.classList.remove('st-' + e.state); e.el.classList.add('st-' + s); e.state = s;
}
function land(e) { e.el.classList.remove('land'); void e.el.offsetWidth; e.el.classList.add('land'); }
function place(e) {
  e.x = clamp(e.x, e.w * 0.4, W - e.w * 0.4);
  e.y = clamp(e.y, e.h * e.foot + 6, H - 4);
  e.el.style.transform = `translate3d(${e.x - e.w / 2}px,${e.y - e.h * e.foot}px,0)`;
  e.el.style.zIndex = Math.round(e.y + e.z);
  e.flip.style.transform = `translateY(${e.hopY}px) scaleX(${e.dir})`;
  if (!e.bub.hidden) {
    const left = e.x - e.bw / 2, shift = clamp(left, 8, W - 8 - e.bw) - left;
    e.bub.style.transform = `translateX(calc(-50% + ${shift}px))`;
  }
}
function say(e, text, dur = 2400, small = '') {
  e.bub.innerHTML = text + (small ? `<small>${small}</small>` : '');
  e.bub.hidden = false; e.bub.style.animation = 'none'; void e.bub.offsetWidth; e.bub.style.animation = '';
  e.bw = e.bub.offsetWidth;
  clearTimeout(e.bt); e.bt = setTimeout(() => { e.bub.hidden = true; }, dur);
}
function moveToward(e, gx, gy, speed, dt) {
  const dx = gx - e.x, dy = gy - e.y, d = Math.hypot(dx, dy);
  if (d < 3 * u) return true;
  const step = Math.min(d, speed * u * dt);

/* ---------- effects ---------- */
const SVG_HEART = s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 21 C5 15.5 1.5 12 1.5 7.5 A5 5 0 0 1 12 5.5 A5 5 0 0 1 22.5 7.5 C22.5 12 19 15.5 12 21Z" fill="#ff6f9c" stroke="#4b3452" stroke-width="1.6"/></svg>`;

const SVG_SPARK = `<svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 1 L14.5 9.5 L23 12 L14.5 14.5 L12 23 L9.5 14.5 L1 12 L9.5 9.5Z" fill="#ffd166" stroke="#4b3452" stroke-width="1.4"/></svg>`;

    + `<b style="left:${8 * s}px;top:${4 * s}px">✦</b><b style="left:${128 * s}px;top:${20 * s}px;animation-direction:reverse">✦</b><b style="left:${66 * s}px;top:${-8 * s}px">✦</b><em>*rough play*</em>`;
  world.appendChild(c); setTimeout(() => c.remove(), dur);
}

/* ---------- pointer target ---------- */
const T = { x: 0, y: 0, active: false, mouse: false, movedAt: 0, id: 0, ax: -999, ay: -999, expires: 0 };
let lastInput = performance.now(), sheetOpen = false, hintGone = false;
function stagePt(e) { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

}

  Object.assign(T, { x, y, active: true, mouse, movedAt: now, expires: mouse ? Infinity : now + 2800 });
  lastInput = now;
  laser.style.transform = `translate3d(${x}px,${y}px,0)`; laser.style.zIndex = Math.round(y - 2);
  laser.classList.add('on');
  if (!hintGone) { hintGone = true; setTimeout(() => $('#hint').classList.add('gone'), 2500); }
}
stage.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || sheetOpen) return;
  const [x, y] = stagePt(e); setTarget(x, y, true);
});
stage.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { T.active = false; laser.classList.remove('on'); } });
stage.addEventListener('pointerdown', e => {
  if (sheetOpen || e.target.closest('#dialog, #sheet')) return;
  if (!e.target.closest('.hi')) document.querySelectorAll('.hi.open').forEach(h => h.classList.remove('open'));
  const [x, y] = stagePt(e);
  if (e.pointerType !== 'mouse') {
    setTarget(x, y, false);
    const r = document.createElement('div'); r.className = 'ripple';
    r.style.left = x + 'px'; r.style.top = y + 'px'; r.style.zIndex = 1999; world.appendChild(r); setTimeout(() => r.remove(), 600);
  }
});

/* ---------- cat brains ---------- */
const DISTRACT = ['(a speck of dust)', '(a wall)', '(nothing. there is nothing there.)', '(his own tail)',
  '(a sound only he heard)', '(the concept of time)', '(a very interesting corner)'];
function pounce(c) {
  const tx = T.x, ty = T.y, isMao = c.kind === 'mao';
  c.tasks = [
    { type: 'state', s: 'crouch', dur: isMao ? 380 : 620 },
    { type: 'hop', dur: 260, dx: c.dir * c.nose * 0.45 },
    { type: 'state', s: isMao ? 'slap' : 'boop', dur: isMao ? 620 : 900,
      onStart: () => isMao ? swat(tx, ty) : boop(tx, ty) }
  ];
}
function runTask(c, now, dt) {
  const t = c.tasks[0];
  if (!t.t0) { t.t0 = now; t.sx = c.x; if (t.s) setState(c, t.s); if (t.onStart) t.onStart(c); }
  const el = now - t.t0;
  const done = () => { if (t.onEnd) t.onEnd(c); c.tasks.shift(); if (!c.tasks.length) setState(c, 'idle'); };
  if (t.type === 'goto') {
    setState(c, t.walk ? 'walk' : 'run');
    const gx = typeof t.x === 'function' ? t.x() : t.x, gy = typeof t.y === 'function' ? t.y() : t.y;
    if (moveToward(c, gx, gy, t.speed || c.speed, dt) || el > 6000) { if (t.face) c.dir = t.face(); done(); }
  } else if (t.type === 'hop') {
    const p = Math.min(1, el / t.dur);
    setState(c, 'air'); c.hopY = -Math.sin(Math.PI * p) * 26 * u; c.x = t.sx + t.dx * p;
    if (p >= 1) { c.hopY = 0; land(c); done(); }
  } else {
    if (t.face) c.dir = t.face();
    if (t.tick && now - (t.lt || 0) > (t.every || 700)) { t.lt = now; t.tick(c); }
    if (el >= t.dur) done();
  }
}
function think(c, now, dt) {
  if (c.tasks.length) { runTask(c, now, dt); return; }
  if (!T.active) { setState(c, 'idle'); return; }
  const dirTo = T.x >= c.x ? 1 : -1;
  const gx = T.x - dirTo * c.nose, gy = T.y + c.off * u + 6 * u;
  const d = Math.hypot(gx - c.x, gy - c.y);
  if (d > 9 * u) {
    setState(c, 'run'); moveToward(c, gx, gy, c.speed, dt);
    if (c === poi && now > poi.nextDistract && Math.random() < dt * 0.3) {
      poi.nextDistract = now + rnd(9000, 14000);
      poi.tasks = [{ type: 'state', s: 'distracted', dur: rnd(2600, 3600), stubborn: true,
        onStart: () => say(poi, 'PoiPoi got distracted by something.', 2900, pick(DISTRACT)) }];
    }
  } else {
    c.dir = dirTo;
    if (now - T.movedAt < 380) setState(c, 'crouch');
    else if (c.lastPounce !== T.id) { c.lastPounce = T.id; pounce(c); }
    else setState(c, 'idle');
  }
}

/* idle behaviours */
function floorPt() { return [rnd(W * 0.12, W * 0.88), rnd(H * 0.78, H - 10)]; }
function settingsPt() {
  const r = $('#bSettings').getBoundingClientRect(), s = stage.getBoundingClientRect();
  return [r.left - s.left + r.width / 2, r.top - s.top + r.height * 0.8];
}
const lickTick = c => fx(c.x + c.dir * c.nose * 0.8, c.y - c.h * 0.7, pick(['lick', 'lick lick', SVG_SPARK]));
const IDLE = [
  [3, function playFight() {
    const mx = clamp((poi.x + mao.x) / 2, W * 0.2, W * 0.8), my = clamp((poi.y + mao.y) / 2, H * 0.78, H - 10);
    let ready = 0;
    const go = () => { if (++ready === 2) fightCloud(mx, my, 2500); };
    poi.tasks = [{ type: 'goto', x: mx - 18 * u, y: my, face: () => 1 }, { type: 'state', s: 'fight', dur: 2600, onStart: go }];
    mao.tasks = [{ type: 'goto', x: mx + 16 * u, y: my + 2, face: () => -1 }, { type: 'state', s: 'fight', dur: 2600, onStart: go }];
  }],
  [3, function poiGroomsMao() {
    const side = poi.x < mao.x ? -1 : 1;
    mao.tasks = [{ type: 'state', s: 'loaf', dur: 900 }, { type: 'state', s: 'happy', dur: 3200 }];
    poi.tasks = [{ type: 'goto', x: () => mao.x + side * mao.w * 0.62, y: () => mao.y + 2, walk: true, speed: 160 },
      { type: 'state', s: 'groom', dur: 3400, face: () => -side, tick: lickTick, every: 650,
        onStart: () => say(poi, 'PoiPoi is grooming MaoMao.', 2200) }];
  }],
  [2, function poiGroomsSelf() {
    poi.tasks = [{ type: 'state', s: 'groom', dur: 2800, tick: lickTick, every: 700 }];
  }],
  [2, function poiGroomsMohit() {
    poi.tasks = [{ type: 'goto', x: mohit.x - mohit.w * 0.42, y: mohit.y + 2, walk: true, speed: 170, face: () => 1 },
      { type: 'state', s: 'groom', dur: 3200, face: () => 1, tick: lickTick, every: 650,
        onStart: () => { setState(mohit, 'flustered'); say(mohit, '...thank you, PoiPoi?', 2400); },
        onEnd: () => setState(mohit, 'idle') }];
  }],
  [1, function maoLoaf() { mao.tasks = [{ type: 'state', s: 'loaf', dur: 4000 }]; }],
  [2, function wander() {
    const c = pick(cats), [x, y] = floorPt();
    c.tasks = [{ type: 'goto', x, y, walk: true, speed: 120 }, { type: 'state', s: 'loaf', dur: 1800 }];
  }],
  [2, function poiSitsOnSettings() {
    const [x, y] = settingsPt();
    poi.tasks = [{ type: 'goto', x, y, walk: true, speed: 150 },
      { type: 'state', s: 'loaf', dur: 7500, onStart: () => { poi.onSettings = true; say(poi, 'PoiPoi sat on Settings.', 2000); },
        onEnd: () => { poi.onSettings = false; } }];
  }]
];
let nextIdle = performance.now() + 6000;
function idleBrain(now) {
  if (T.active || sheetOpen || now < nextIdle || now - lastInput < 3500) return;
  if (poi.tasks.length || mao.tasks.length) return;
  let r = Math.random() * IDLE.reduce((s, b) => s + b[0], 0);
  for (const [w, fn] of IDLE) { if ((r -= w) <= 0) { fn(); break; } }
  nextIdle = now + rnd(5000, 8500);
}

/* ---------- tapping characters ---------- */
const POI_NO = ['PoiPoi does not like being touched.', 'PoiPoi is an independent cat. Please respect that.',
  'PoiPoi has left the chat.', 'No. (signed, PoiPoi)'];
const MOHIT_LINES = ["Yes. I'm the main character.", 'You may admire me. Briefly.', '*pushes glasses up*',
  '44 followers. Basically famous.', 'Please do not touch the hair.'];
let mohitLine = 0;
function onCharTap(e, ev) {
  ev.stopPropagation(); lastInput = performance.now();
  if (e === poi) {
    poi.onSettings = false;
    const away = poi.x < W / 2 ? 1 : -1;
    poi.tasks = [{ type: 'state', s: 'annoyed', dur: 650, stubborn: true, onStart: () => say(poi, pick(POI_NO), 2200) },
      { type: 'goto', x: poi.x + away * rnd(120, 190) * u, y: clamp(poi.y + rnd(-30, 30) * u, H * 0.78, H - 10), speed: 300, stubborn: true }];
  } else if (e === mao) {
    mao.trust++; store.set('maoTrust', mao.trust);
    if (mao.trust <= 3) {
      mao.tasks = [{ type: 'goto', x: mohit.x + mohit.w * 0.18, y: mohit.y - 8 * u, speed: 420, stubborn: true, onStart: () => { mao.z = -60; } },
        { type: 'state', s: 'hide', dur: 2600, stubborn: true, face: () => -1,
          onStart: () => say(mao, mao.trust < 3 ? 'MaoMao is shy. He doesn\'t know you yet.' : 'MaoMao is peeking at you...', 2400),
          onEnd: () => { mao.z = 0; } }];
    } else {
      mao.tasks = [{ type: 'state', s: 'happy', dur: 2200, stubborn: true,
        onStart: () => {
          say(mao, mao.trust === 4 ? 'MaoMao trusts you now. He is a very sweet boy.' : pick(['*purrrr*', 'MaoMao loves you.', '*happy biscuits*']), 2400);
          fx(mao.x, mao.y - mao.h * 0.9, SVG_HEART(24)); setTimeout(() => fx(mao.x + 16 * u, mao.y - mao.h, SVG_HEART(18)), 220);
        } }];
    }
  } else {
    setState(mohit, 'glasses'); say(mohit, MOHIT_LINES[mohitLine++ % MOHIT_LINES.length], 2200);
    clearTimeout(mohit.gt); mohit.gt = setTimeout(() => setState(mohit, 'idle'), 850);
  }
}
for (const e of [mohit, poi, mao]) e.el.addEventListener('pointerdown', ev => onCharTap(e, ev));

/* ---------- dialog + menu ---------- */
function dialog(html, tag = 'System') {
  dlg.innerHTML = `<span class="tag">${tag}</span><div>${html}</div><span class="next">tap to close</span>`;
  dlg.hidden = false;
}
dlg.addEventListener('pointerdown', e => {
  if (e.target.closest('.hi')) return;
  e.stopPropagation(); dlg.hidden = true;
});
document.addEventListener('click', e => {
  const h = e.target.closest('.hi'); if (!h) return;
  e.stopPropagation(); h.classList.toggle('open');
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!dlg.hidden) dlg.hidden = true; else if (sheetOpen) closeSheet();
});
$('#bStart').addEventListener('click', () => dialog('<b>Chapter 1</b> isn\'t built yet. PoiPoi is guarding it.<br>He won\'t fight you. He also won\'t move.'));
$('#bContinue').addEventListener('click', () => dialog(`Continue what? You haven't even started. ${hi('Arey yaar', 'oh come on, man')}.`));
$('#bSettings').addEventListener('click', () => {
  if (poi.onSettings) { dialog('PoiPoi is sitting on Settings.<br>Settings belong to PoiPoi now.'); say(poi, '...', 1500); }
  else dialog(`<b>Settings</b><br>Sound: off (MaoMao chewed the cable)<br>Difficulty: Cat<br>Language: English, with a little ${hi('masala', 'spice')}`);
});
$('#bParty').addEventListener('click', openSheet);

/* ---------- party sheet (art test) ---------- */
const PARTY = [
  { kind: 'mohit', name: 'Mohit', role: 'Main Character', color: 'var(--accent)', bg: 'var(--mohit-bg)',
    facts: 'Human · glasses · iconic hair',
    about: 'Thinks this is Mohit\'s story. It is not. It is the cats\' story.',
    stats: [['SMUG', 10], ['HAIR', 9], ['ATK', 3]],
    skills: ['Main Character Pose', 'Hair Flip', 'Coke Zero Chug', 'Post a Story'], ult: hi('Jugaad', 'a hacky, improvised fix'),
    tries: [['Idle', 'idle'], ['Push glasses', 'glasses'], ['Getting groomed', 'flustered']] },
  { kind: 'poi', name: 'PoiPoi', role: 'Diplomat', color: '#5aa9e6', bg: 'var(--poi-bg)',
    facts: `Ragdoll · ${age(DOB.poi)} · boy`,
    about: `Physically incapable of violence. A VERY independent ${hi('billa', 'tomcat')}. Hates being picked up. Gets distracted.`,
    stats: [['FLUFF', 10], ['FOCUS', 1], ['ATK', 0]],
    skills: ['Slow Blink', 'Offer Groom', 'Loaf Nearby', 'Ignore Completely'], ult: 'Marshmallow Aura',
    tries: [['Idle', 'idle'], ['Run', 'run'], ['Boop', 'boop'], ['Groom', 'groom'], ['Distracted', 'distracted'], ['Annoyed', 'annoyed']] },
  { kind: 'mao', name: 'MaoMao', role: 'Tiny Menace', color: '#9a7cf0', bg: 'var(--mao-bg)',
    facts: `Persian · ${age(DOB.mao)} · boy · very tiny`,
    about: 'Shy with strangers. Very sharp claws. Also a very sweet, cuddly boy.',
    stats: [['CLAWS', 9], ['SHY', 8], ['SIZE', 2]],
    skills: ['Needle Claws', 'Sideways Hop', 'Ankle Ambush', 'Cuddle Heal'], ult: 'Kitten Fury',
    tries: [['Idle', 'idle'], ['Run', 'run'], ['Pounce', 'crouch'], ['Swat', 'slap'], ['Shy', 'hide'], ['Purr', 'happy'], ['Loaf', 'loaf']] }
];
function buildSheet() {
  sheet.innerHTML = `<div class="sheet-inner">
    <div class="sheet-head"><div><h2>Meet the party</h2><p>Art test v0.1 · tap the buttons to try each animation</p></div>
    <button class="btn close" type="button" id="bClose" aria-label="Close">✕</button></div>
    <div class="cards">${PARTY.map((p, i) => `
      <article class="card" style="--role:${p.color}">
        <div class="stagebox" style="background:${p.bg}" data-slot="${i}"></div>
        <h3>${p.name} <small>${p.role}</small></h3>
        <p class="facts">${p.facts}</p>
        <p class="about">${p.about}</p>
        <div class="stats">${p.stats.map(([k, v]) => `<span>${k}</span><span class="bar"><i style="width:${v * 10}%"></i></span><span class="n">${v}</span>`).join('')}</div>
        <div class="chips">${p.skills.map(s => `<span>${s}</span>`).join('')}<span class="ult">★ ${p.ult}</span></div>
        <div class="try"><span class="label">Try</span>${p.tries.map(([l, s]) => `<button type="button" data-i="${i}" data-s="${s}">${l}</button>`).join('')}</div>
      </article>`).join('')}</div>
    <p class="sheet-note">Everything here is drawn in code, so every pose can move.</p></div>`;
  PARTY.forEach((p, i) => {
    const sp = makeSprite(p.kind);
    const w = p.kind === 'mohit' ? 118 : p.kind === 'poi' ? 170 : 128;
    sp.style.width = w + 'px'; sp.style.height = (p.kind === 'mohit' ? w * 170 / 120 : w * 120 / 140) + 'px';
    sp.querySelector('.bubble').remove();
    p.sprite = sp; p.state = 'idle';
    sheet.querySelector(`[data-slot="${i}"]`).appendChild(sp);
  });
  sheet.querySelector('#bClose').addEventListener('click', closeSheet);
  sheet.addEventListener('pointerdown', e => e.stopPropagation());
  sheet.addEventListener('click', e => {
    const b = e.target.closest('.try button'); if (!b) return;
    const p = PARTY[+b.dataset.i], sp = p.sprite;
    sp.classList.remove('st-' + p.state); p.state = b.dataset.s; sp.classList.add('st-' + p.state);
    clearTimeout(p.t);
    if (['boop', 'slap', 'glasses', 'crouch'].includes(p.state))
      p.t = setTimeout(() => { sp.classList.remove('st-' + p.state); p.state = 'idle'; sp.classList.add('st-idle'); }, 1400);
  });
}
function openSheet() { if (!sheet.firstChild) buildSheet(); sheet.hidden = false; sheetOpen = true; T.active = false; laser.classList.remove('on'); }
function closeSheet() { sheet.hidden = true; sheetOpen = false; }

/* ---------- loop ---------- */
size();
poi.x = -60; poi.y = H - 40 * u; mao.x = -120; mao.y = H - 22 * u; poi.dir = mao.dir = 1;
poi.tasks = [{ type: 'goto', x: W * 0.3, y: H - 46 * u, speed: 260 },
  { type: 'state', s: 'idle', dur: 200, onStart: () => say(poi, 'PoiPoi has entered the website.', 2400) }];
mao.tasks = [{ type: 'state', s: 'idle', dur: 900 }, { type: 'goto', x: W * 0.5, y: H - 24 * u, speed: 300 },
  { type: 'state', s: 'hide', dur: 1400, onStart: () => say(mao, '...', 1400) }];
land(mohit);
addEventListener('resize', size);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (T.active && now > T.expires) { T.active = false; laser.classList.remove('on'); }
  if (!sheetOpen) {
    idleBrain(now);
    for (const c of cats) think(c, now, dt);
  }
  for (const e of [mohit, poi, mao]) place(e);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
